name: Framework checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate default adapter
        run: python3 scripts/init_project.py --adapter default --validate-adapter --format json
      - name: Loop contract regression
        run: python3 .gstack/scripts/gstack_loop_contract_smoke.py --format user
      - name: Natural language journey regression
        run: python3 .gstack/scripts/natural_language_dev_smoke.py --format user
